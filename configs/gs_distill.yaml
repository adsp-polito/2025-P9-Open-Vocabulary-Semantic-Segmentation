# GS-Distill base configuration
# Inherits RIPD / CLIP settings from vitb_384.yaml.
# These values are read by scripts/train_distill.py and scripts/cache_teacher.py.

# ── Student architecture ──────────────────────────────────────────────────────
STUDENT:
  CLIP_PRETRAINED: "ViT-B/16"
  CLIP_LAYERS: [4, 8, 10, 12]   # resblock indices to hook for multi-layer features
  HIDDEN_DIM: 128                # must match RIPD HIDDEN_DIMS
  D_DINO: 768                    # DINOv3Wrapper output feature dim (after 1024→768 projection)
  NUM_CLASSES: 40                # LD50K vocabulary size

# ── Teacher / RIPD settings (must match vitb_384.yaml) ───────────────────────
RIPD:
  HIDDEN_DIMS: 128
  NUM_LAYERS: 2
  NUM_HEADS: 4
  TEXT_GUIDANCE_DIM: 512
  TEXT_GUIDANCE_PROJ_DIM: 128
  APPEARANCE_GUIDANCE_DIM: 512
  APPEARANCE_GUIDANCE_PROJ_DIM: 128
  DECODER_DIMS: [64, 32]
  DECODER_GUIDANCE_DIMS: [256, 128]
  DECODER_CLIP_GUIDANCE_DIMS: [256, 128]
  DECODER_CLIP_GUIDANCE_PROJ_DIMS: [32, 16]
  DECODER_DINO_GUIDANCE_DIMS: [256, 128]
  DECODER_DINO_GUIDANCE_PROJ_DIMS: [32, 16]
  FEATURE_RESOLUTION: [24, 24]
  FUSION_TYPE: "query_guided"

# ── Distillation training ─────────────────────────────────────────────────────
DISTILL:
  EPOCHS: 30
  BATCH_SIZE: 16
  LR: 1.0e-4
  WEIGHT_DECAY: 1.0e-4
  WARMUP_EPOCHS: 3            # linear warmup before cosine decay
  VAL_FRACTION: 0.05
  AMP: true                   # mixed precision (fp16)
  NUM_WORKERS: 4
  LOG_INTERVAL: 50

# ── Cache generation ─────────────────────────────────────────────────────────
CACHE:
  BATCH_SIZE: 4
  NUM_WORKERS: 4
  RESOLUTION: 384

# ── Fine-tuning (Phase 4, optional) ──────────────────────────────────────────
FINETUNE:
  EPOCHS: 10
  BATCH_SIZE: 8
  LR: 1.0e-5
  WEIGHT_DECAY: 1.0e-4
  UNFREEZE_RIPD: false
  AMP: true
  NUM_WORKERS: 4
  IGNORE_INDEX: 255

# ── Datasets ──────────────────────────────────────────────────────────────────
DATASETS:
  TRAIN_CLASS_JSON: "datasets/landdiscover.json"
  TEST_DATASETS:    ["FLAIR", "FAST", "Potsdam", "FloodNet"]

# ── Ablation presets ──────────────────────────────────────────────────────────
# Override individual fields via command-line when running ablations.
# Example:
#   python scripts/train_distill.py --clip-layers 10 12     # CLIP layer ablation
#   python scripts/train_distill.py --clip-layers 12        # single-layer baseline
